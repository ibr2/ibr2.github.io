---
layout: default
---

<h1>{{ page.title }}</h1>

<ul class="list">
  {% for post in site.posts %}
    <li>
      <div class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</div>
      <a href="{{ post.url }}"><strong>{{ post.title }}</strong></a>
      {% if post.excerpt %}<div class="muted">{{ post.excerpt | strip_html | truncate: 160 }}</div>{% endif %}
    </li>
  {% endfor %}
</ul>
